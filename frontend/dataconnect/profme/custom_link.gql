# CustomLink テーブルを起点とする mutation
#
# 取得は User の relation 経由で `customLinks_on_user` から引くので、
# このファイルには query は無い (GetMyProfile / GetProfile に含まれている)。

# 自分の CustomLink を全削除 (プロフィール更新時に「全消し → 一括追加」する用)
mutation DeleteAllMyCustomLinks @auth(level: USER) {
  customLink_deleteMany(where: { userUid: { eq_expr: "auth.uid" } })
}

# 自分の CustomLink を 1 件追加。userUid は CEL で auth.uid を強制する
# (リクエスト body から uid を受けないので、他人の行を作れない)
mutation CreateMyCustomLink($title: String!, $url: String!) @auth(level: USER) {
  customLink_insert(
    data: {
      userUid_expr: "auth.uid"
      title: $title
      url: $url
    }
  )
}
