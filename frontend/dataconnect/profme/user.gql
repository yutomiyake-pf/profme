# User テーブルを起点とする query / mutation

# 自分のプロフィール取得 (ログイン済みユーザの uid を auth から取得)
query GetMyProfile @auth(level: USER) {
  user(key: { uid_expr: "auth.uid" }) {
    uid
    phoneNumber
    displayName
    university
    faculty
    grade
    bio
    gakuchika
    avatarUrl
    cardTheme
    twitter
    instagram
    github
    linkedin
    skills
    hobbies
    qualifications
  }
}

# 公開プロフィール取得 (名刺ページ /card/[userId] 用)
query GetUserProfile($uid: String!) @auth(level: PUBLIC) {
  user(key: { uid: $uid }) {
    uid
    displayName
    university
    faculty
    grade
    bio
    gakuchika
    avatarUrl
    cardTheme
    twitter
    instagram
    github
    linkedin
    skills
    hobbies
    qualifications
  }
}

# 電話番号でユーザを検索 (ログインフローで利用、API Route 経由でのみ呼び出す)
# phoneNumber は @unique なので 0 or 1 件しか返らない。
# 単体取得用の `first` フィールド (where 指定) を使い、見つからなければ data.user は null。
query GetUserByPhone($phoneNumber: String!) @auth(level: PUBLIC) {
  user(first: { where: { phoneNumber: { eq: $phoneNumber } } }) {
    uid
    displayName
  }
}

# 新規ユーザ作成 (ログインフローのサインアップ時に利用)
mutation CreateUser($uid: String!, $phoneNumber: String!, $displayName: String!)
@auth(level: PUBLIC) {
  user_insert(
    data: {
      uid: $uid
      phoneNumber: $phoneNumber
      displayName: $displayName
      cardTheme: "navy"
      skills: []
      hobbies: []
      qualifications: []
    }
  )
}
