# 自分↔対象 の follow 行 (双方向) を 1 リクエストで取得
query GetFollowRelationship($other: String!) @auth(level: USER) {
  outgoing: follow(key: { followerUid_expr: "auth.uid", followeeUid: $other }) {
    status
  }
  incoming: follow(key: { followerUid: $other, followeeUid_expr: "auth.uid" }) {
    status
  }
}

# 自分→対象 の follow 申請 (status="pending")。
# 同時 POST race で duplicate key エラーになるのを防ぐため upsert で実行する
# (既存行があっても status は pending のまま上書きされるだけで実害なし)
mutation CreateFollowRequest($followeeUid: String!) @auth(level: USER) {
  follow_upsert(
    data: { followerUid_expr: "auth.uid", followeeUid: $followeeUid, status: "pending" }
  )
}

# 対象→自分 の pending リクエストを承認 (status="approved", approvedAt をセット)。
# - status="pending" を where 条件に含めることで、すでに approved な行を
#   再承認して approvedAt を上書きする事故を防ぐ (冪等性確保)。
# - filter (where) 句では _expr が使えないため auth.uid は呼び出し側 (API)
#   から $me として渡す。@auth(level: USER) + 唯一の呼び出し元が verified な
#   session.uid を渡す前提でセキュリティを担保する。
# 戻り値は更新件数 (Int)。0 件 = 既に approved or 行無しのケース。
mutation ApproveIncomingFollow($me: String!, $otherUid: String!) @auth(level: USER) {
  follow_updateMany(
    where: {
      followerUid: { eq: $otherUid }
      followeeUid: { eq: $me }
      status: { eq: "pending" }
    }
    data: { status: "approved", approvedAt_expr: "request.time" }
  )
}

# 自分宛の pending フォロー申請一覧 (ページネーション + 総件数)。
# - items: 表示用に limit/offset で切り出した行
# - totals: 同じ where のまま _count だけ select すると 1 行集計が返る
#           (totals[0]._count = 総件数。0 件なら配列が空になるので ?? 0 fallback)
# - $me は API 側 (verified session.uid) からしか渡らない前提
query GetIncomingFollowRequests($me: String!, $limit: Int!, $offset: Int!) @auth(level: USER) {
  items: follows(
    where: { followeeUid: { eq: $me }, status: { eq: "pending" } }
    orderBy: [{ requestedAt: DESC }]
    limit: $limit
    offset: $offset
  ) {
    requestedAt
    follower {
      uid
      displayName
      avatarUrl
      university
    }
  }
  totals: follows(where: { followeeUid: { eq: $me }, status: { eq: "pending" } }) {
    _count
  }
}

# 自分宛の pending フォロー申請を却下 (= 行削除)
mutation RejectIncomingFollow($otherUid: String!) @auth(level: USER) {
  follow_delete(key: { followerUid: $otherUid, followeeUid_expr: "auth.uid" })
}

# 自分のフォロワー (= followee=自分 で approved な行) のページネーション付き一覧。
query GetMyFollowers($me: String!, $limit: Int!, $offset: Int!) @auth(level: USER) {
  items: follows(
    where: { followeeUid: { eq: $me }, status: { eq: "approved" } }
    orderBy: [{ approvedAt: DESC }]
    limit: $limit
    offset: $offset
  ) {
    approvedAt
    follower {
      uid
      displayName
      avatarUrl
      university
    }
  }
  totals: follows(where: { followeeUid: { eq: $me }, status: { eq: "approved" } }) {
    _count
  }
}

# フォロワー解除 (= 自分宛の approved 行を削除)。
# 行スキーマは pending と同じ複合キーのため follow_delete を使うが、
# 意味的に reject (申請却下) と分けるため別 mutation として定義する。
mutation RemoveFollower($otherUid: String!) @auth(level: USER) {
  follow_delete(key: { followerUid: $otherUid, followeeUid_expr: "auth.uid" })
}
