# Endorsement 申請を pending で作成。受信側 (recipient) が承認するまで非公開。
mutation CreateEndorsementRequest(
  $recipientUid: String!
  $relationship: String
  $episode: String!
  $tags: [String!]!
) @auth(level: USER) {
  endorsement_insert(
    data: {
      recipientUid: $recipientUid
      authorUid_expr: "auth.uid"
      relationship: $relationship
      episode: $episode
      tags: $tags
      status: "pending"
    }
  )
}

# 公開閲覧用: 受信ユーザの承認済み Endorsement をページネーションで取得 + 総件数も返す。
# totals[0]._count で総件数 (0 件のときは ?? 0)。
query GetEndorsementsByRecipient($recipientUid: String!, $limit: Int!, $offset: Int!)
@auth(level: PUBLIC) {
  items: endorsements(
    where: { recipientUid: { eq: $recipientUid }, status: { eq: "approved" } }
    orderBy: [{ approvedAt: DESC }]
    limit: $limit
    offset: $offset
  ) {
    id
    relationship
    episode
    tags
    approvedAt
    author {
      uid
      displayName
      avatarUrl
    }
  }
  totals: endorsements(
    where: { recipientUid: { eq: $recipientUid }, status: { eq: "approved" } }
  ) {
    _count
  }
}

# 自分宛の pending Endorsement をページネーションで取得 (承認待ち一覧)。
# totals[0]._count で総件数を取る (0 件のときは ?? 0)。
query GetPendingEndorsementsForRecipient($me: String!, $limit: Int!, $offset: Int!)
@auth(level: USER) {
  items: endorsements(
    where: { recipientUid: { eq: $me }, status: { eq: "pending" } }
    orderBy: [{ createdAt: DESC }]
    limit: $limit
    offset: $offset
  ) {
    id
    relationship
    episode
    tags
    createdAt
    author {
      uid
      displayName
      avatarUrl
    }
  }
  totals: endorsements(where: { recipientUid: { eq: $me }, status: { eq: "pending" } }) {
    _count
  }
}

# Pending Endorsement の承認 (status="approved", approvedAt をセット)。
# - id 単独だと他人の endorsement も触れてしまうので recipientUid で所有者チェック
# - status="pending" を where に含めて再承認 (approvedAt 上書き) を防ぐ
mutation ApproveEndorsement($me: String!, $endorsementId: UUID!) @auth(level: USER) {
  endorsement_updateMany(
    where: {
      id: { eq: $endorsementId }
      recipientUid: { eq: $me }
      status: { eq: "pending" }
    }
    data: { status: "approved", approvedAt_expr: "request.time" }
  )
}

# Pending Endorsement の却下 (= 行削除)。
# 自分宛 (recipient=自分) かつ pending のものだけを削除対象にする。
mutation RejectEndorsement($me: String!, $endorsementId: UUID!) @auth(level: USER) {
  endorsement_deleteMany(
    where: {
      id: { eq: $endorsementId }
      recipientUid: { eq: $me }
      status: { eq: "pending" }
    }
  )
}
