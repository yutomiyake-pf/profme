# User: 1 ユーザにつき 1 行。Firebase Auth の uid を主キーにする。
# プロフィール編集フォームのフィールドと 1:1 で対応。

type User @table(key: ["uid"]) {
  uid: String!
  phoneNumber: String! @unique

  # 基本情報
  displayName: String!
  university: String
  faculty: String
  grade: String
  bio: String
  gakuchika: String
  avatarUrl: String

  # 名刺カラーテーマ ("navy" | "rose" | ... cardThemes と同期)
  cardTheme: String!

  # SNS リンク (URL を直接保存)
  twitter: String
  instagram: String
  github: String
  linkedin: String

  # タグ系 (Postgres TEXT[])
  skills: [String!]!
  hobbies: [String!]!
  qualifications: [String!]!

  # 名刺の公開設定 (フィールド単位)
  # owner 自身は常に閲覧可。他者は false の項目が API で空 (null / [] 等) にマスクされる。
  # 大学情報 = university + faculty + grade をひとまとめ
  universityVisible: Boolean! @default(value: true)
  # SNS = twitter + instagram + github + linkedin をひとまとめ
  snsVisible: Boolean! @default(value: true)
  # 受け取った endorsement 一覧 (= /card/[uid] で表示される他己評価)
  endorsementsVisible: Boolean! @default(value: true)
  # ポートフォリオ等の自由リンク (CustomLink テーブル)
  customLinksVisible: Boolean! @default(value: true)

  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}
